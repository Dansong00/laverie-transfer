name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: install, typecheck, lint, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: laverie
          POSTGRES_PASSWORD: laverie
          POSTGRES_DB: laverie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U laverie -d laverie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway role inside the job's Postgres container. Not a project secret.
      DATABASE_URL: postgresql://laverie:laverie@localhost:5432/laverie
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
