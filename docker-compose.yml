# Local Postgres only. The password is a disposable development default.
# Hosted preview and production databases stay on Neon, with their own credentials.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: laverie
      POSTGRES_PASSWORD: laverie
      POSTGRES_DB: laverie
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laverie -d laverie"]
      interval: 5s
      timeout: 5s
      retries: 10
